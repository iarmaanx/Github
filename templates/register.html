{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container glass-panel">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
            <h2>Operator Provisioning</h2>
            <p>Create your secure access profile</p>
        </div>
        
        <form method="POST" action="{{ url_for('register') }}" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose operator ID" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter contact email" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Create secure passphrase" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Provision Account</span>
                <i class="fas fa-check"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Already have clearance? <a href="{{ url_for('login') }}">Authenticate Here</a></p>
        </div>
    </div>
</div>
{% endblock %}
