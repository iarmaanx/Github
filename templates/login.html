{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-container glass-panel">
        <div class="auth-header">
            <div class="auth-icon"><i class="fas fa-shield-alt"></i></div>
            <h2>NetSniff Pro</h2>
            <p>Secure Operations Login</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter operator ID" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter secure passphrase" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Authenticate</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have clearance? <a href="{{ url_for('register') }}">Request Access</a></p>
        </div>
    </div>
</div>
{% endblock %}
